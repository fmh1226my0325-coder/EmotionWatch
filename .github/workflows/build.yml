
name: Build EmotionMusic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Check Xcode Schemes
        run: xcodebuild -list -project EmotionMusic.xcodeproj

      - name: Build iPhone App
        run: |
          set +e
          xcodebuild \
            -project EmotionMusic.xcodeproj \
            -scheme EmotionMusic \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build > iphone-build.log 2>&1
          result=$?
          if [ $result -ne 0 ]; then
            grep -n -C 3 -E 'error:|fatal error:|BUILD FAILED' iphone-build.log | head -100 || tail -80 iphone-build.log
          else
            echo "iPhone build succeeded"
          fi
          exit $result

      - name: Build Apple Watch App
        if: success()
        run: |
          set +e
          xcodebuild \
            -project EmotionMusic.xcodeproj \
            -scheme EmotionMusicWatch \
            -sdk watchsimulator \
            -destination 'generic/platform=watchOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build > watch-build.log 2>&1
          result=$?
          if [ $result -ne 0 ]; then
            grep -n -C 3 -E 'error:|fatal error:|BUILD FAILED' watch-build.log | head -100 || tail -80 watch-build.log
          else
            echo "Apple Watch build succeeded"
          fi
          exit $result

      - name: Save Build Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EmotionMusic-Build-Logs
          path: |
            iphone-build.log
            watch-build.log
          if-no-files-found: ignore
