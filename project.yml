
name: EmotionMusic

options:
  bundleIdPrefix: com.emotionmusic
  postGenCommand: |
    set -e
    sed -i '' \
      -e 's|dstPath = "$(CONTENTS_FOLDER_PATH)/Watch";|dstPath = "";|' \
      -e 's|dstSubfolderSpec = 16;|dstSubfolderSpec = 13;|' \
      EmotionMusic.xcodeproj/project.pbxproj
    echo "Checking Watch embedding configuration..."
    grep -n -A 8 -B 3 'Embed Watch Content' EmotionMusic.xcodeproj/project.pbxproj

deploymentTarget:
  iOS: "17.0"
  watchOS: "10.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    GENERATE_INFOPLIST_FILE: YES

targets:
  EmotionMusic:
    type: application
    platform: iOS
    sources:
      - path: Shared
      - path: iOS
    dependencies:
      - target: EmotionMusicWatch
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.emotionmusic.ios
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_CFBundleDisplayName: EmotionMusic

  EmotionMusicWatch:
    type: application
    platform: watchOS
    sources:
      - path: Shared
      - path: Watch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.emotionmusic.ios.watchkitapp
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES
        INFOPLIST_KEY_CFBundleDisplayName: EmotionMusic
        INFOPLIST_KEY_WKWatchKitApp: YES
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.emotionmusic.ios
        INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: YES
