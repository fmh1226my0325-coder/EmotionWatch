
name: Build EmotionMusic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Show schemes
        run: xcodebuild -list -project EmotionMusic.xcodeproj

      - name: Build iPhone app
        run: |
          xcodebuild \
            -project EmotionMusic.xcodeproj \
            -scheme EmotionMusic \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build Apple Watch app
        run: |
          xcodebuild \
            -project EmotionMusic.xcodeproj \
            -scheme EmotionMusicWatch \
            -sdk watchsimulator \
            -destination 'generic/platform=watchOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
