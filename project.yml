
name: EmotionMusic

options:
  bundleIdPrefix: com.emotionmusic

deploymentTarget:
  iOS: "17.0"
  watchOS: "10.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    GENERATE_INFOPLIST_FILE: YES

targets:
  EmotionMusic:
    type: application
    platform: iOS
    sources:
      - path: Shared
      - path: iOS
    dependencies:
      - target: EmotionMusicWatch
        embed: true
    info:
      properties:
        UIBackgroundModes:
          - audio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.emotionmusic.ios
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_CFBundleDisplayName: EmotionMusic
        INFOPLIST_KEY_UILaunchScreen_Generation: YES

  EmotionMusicWatch:
    type: application
    platform: watchOS
    sources:
      - path: Shared
      - path: Watch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.emotionmusic.ios.watchkitapp
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES
        INFOPLIST_KEY_CFBundleDisplayName: EmotionMusic
        INFOPLIST_KEY_WKWatchKitApp: YES
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.emotionmusic.ios
        INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: YES
