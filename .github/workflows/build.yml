
name: Build EmotionMusic iPhone + Apple Watch

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build iPhone App with Embedded Watch App
        run: |
          set -o pipefail
          xcodebuild \
            -project EmotionMusic.xcodeproj \
            -scheme EmotionMusic \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee iphone-build.log

      - name: Verify iPhone App
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/EmotionMusic.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: iPhone App not found"
            exit 1
          fi

          echo "iPhone App exists."

          if /usr/libexec/PlistBuddy -c "Print :UIBackgroundModes" "$APP_PATH/Info.plist"; then
            echo "Background audio configuration found."
          else
            echo "WARNING: UIBackgroundModes is missing."
            echo "Continuing to verify Apple Watch App."
          fi

      - name: Verify Embedded Apple Watch App
        run: |
          set -e

          APP_PATH="build/Build/Products/Release-iphoneos/EmotionMusic.app"

          echo "Searching for embedded Watch App..."

          WATCH_APP="$(find "$APP_PATH" \
            -mindepth 2 -type d -name '*.app' -print -quit)"

          if [ -z "$WATCH_APP" ]; then
            echo "ERROR: Apple Watch App is not embedded!"
            find "$APP_PATH" -maxdepth 5 -print
            exit 1
          fi

          echo "Found Watch App: $WATCH_APP"

          WATCH_ID=$(/usr/libexec/PlistBuddy \
            -c "Print :CFBundleIdentifier" "$WATCH_APP/Info.plist")

          COMPANION_ID=$(/usr/libexec/PlistBuddy \
            -c "Print :WKCompanionAppBundleIdentifier" "$WATCH_APP/Info.plist")

          echo "Watch Bundle ID: $WATCH_ID"
          echo "Companion Bundle ID: $COMPANION_ID"

          test "$WATCH_ID" = "com.emotionmusic.ios.watchkitapp"
          test "$COMPANION_ID" = "com.emotionmusic.ios"

          echo "SUCCESS: Watch App is embedded and identifiers match."

      - name: Package Unsigned IPA
        run: |
          set -e

          mkdir -p Payload

          cp -R \
            build/Build/Products/Release-iphoneos/EmotionMusic.app \
            Payload/

          zip -qry EmotionMusic-unsigned.ipa Payload

          echo "IPA packaged successfully."

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: EmotionMusic-iPhone-Watch-Unsigned-IPA
          path: EmotionMusic-unsigned.ipa

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EmotionMusic-Build-Log
          path: iphone-build.log
          if-no-files-found: ignore
