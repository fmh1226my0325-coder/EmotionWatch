
name: Build EmotionMusic iPhone + Apple Watch

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build iPhone App with Embedded Watch App
        run: |
          set -o pipefail
          xcodebuild \
            -project EmotionMusic.xcodeproj \
            -scheme EmotionMusic \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee iphone-build.log

      - name: Verify iPhone App
        run: |
          set -e

          APP_PATH="build/Build/Products/Release-iphoneos/EmotionMusic.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: iPhone App not found"
            exit 1
          fi

          echo "iPhone App exists."

          if /usr/libexec/PlistBuddy -c "Print :UIBackgroundModes" "$APP_PATH/Info.plist"; then
            echo "Background audio configuration found."
          else
            echo "WARNING: UIBackgroundModes is missing."
          fi

      - name: Verify Embedded Apple Watch App
        run: |
          set -e

          APP_PATH="build/Build/Products/Release-iphoneos/EmotionMusic.app"
          WATCH_APP="$APP_PATH/Watch/EmotionMusicWatch.app"

          if [ ! -d "$WATCH_APP" ]; then
            echo "ERROR: Watch App not found at expected path"
            echo "Searching for Watch app..."
            find "$APP_PATH" -maxdepth 5 -name "*.app" -print
            exit 1
          fi

          echo "Found Watch App: $WATCH_APP"

          WATCH_ID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$WATCH_APP/Info.plist")
          COMPANION_ID=$(/usr/libexec/PlistBuddy -c "Print :WKCompanionAppBundleIdentifier" "$WATCH_APP/Info.plist")

          echo "Watch Bundle ID: $WATCH_ID"
          echo "Companion Bundle ID: $COMPANION_ID"

          test "$WATCH_ID" = "com.emotionmusic.ios.watchkitapp"
          test "$COMPANION_ID" = "com.emotionmusic.ios"

          echo "SUCCESS: Watch App is embedded and identifiers match."

      - name: Inspect Watch App Metadata
        run: |
          set -e

          WATCH_APP="build/Build/Products/Release-iphoneos/EmotionMusic.app/Watch/EmotionMusicWatch.app"

          echo "===== WATCH INFO.PLIST ====="
          /usr/libexec/PlistBuddy -c "Print" "$WATCH_APP/Info.plist"

          echo "===== WATCH EXECUTABLE ====="
          EXECUTABLE=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$WATCH_APP/Info.plist")
          echo "Executable: $EXECUTABLE"
          file "$WATCH_APP/$EXECUTABLE"

          echo "===== WATCH BUILD PLATFORM ====="
          xcrun vtool -show-build "$WATCH_APP/$EXECUTABLE"

          echo "===== WATCH APP CONTENTS ====="
          find "$WATCH_APP" -maxdepth 3 -print

      - name: Package Unsigned IPA
        run: |
          set -e

          mkdir -p Payload

          cp -R \
            build/Build/Products/Release-iphoneos/EmotionMusic.app \
            Payload/

          zip -qry EmotionMusic-unsigned.ipa Payload

          echo "IPA packaged successfully."

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: EmotionMusic-iPhone-Watch-Unsigned-IPA
          path: EmotionMusic-unsigned.ipa

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EmotionMusic-Build-Log
          path: iphone-build.log
          if-no-files-found: ignore
