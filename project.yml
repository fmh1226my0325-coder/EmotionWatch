
name: EmotionMusic

options:
  bundleIdPrefix: com.emotionmusic
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"

settings:
  base:
    SWIFT_VERSION: "5.0"

targets:
  EmotionMusic:
    type: application
    platform: iOS
    sources:
      - path: Shared
      - path: iOS
    info:
      path: EmotionMusic-Info.plist
      properties:
        CFBundleDisplayName: EmotionMusic
        UIBackgroundModes:
          - audio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.emotionmusic.ios
        PRODUCT_NAME: EmotionMusic
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        SUPPORTS_MACCATALYST: NO

  EmotionMusicWatch:
    type: application
    platform: watchOS
    sources:
      - path: Shared
      - path: Watch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.emotionmusic.watch
        INFOPLIST_KEY_CFBundleDisplayName: EmotionMusic
